services:
  - type: web
    name: auraplant-diary
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @monodiary/api... --prod=false && pnpm --filter @monodiary/timeline-core build && pnpm --filter @monodiary/api build
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: auraplant-diary-db
          property: connectionString

databases:
  - name: auraplant-diary-db
    plan: basic-256mb
