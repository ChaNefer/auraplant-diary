services:
  - type: web
    name: auraplant-diary
    runtime: node
    plan: starter
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: auraplant-diary-db
          property: connectionString

databases:
  - name: auraplant-diary-db
    plan: basic-256mb
